name: await-approval
description: >
  Pause the job on a GitHub issue until an allowlisted approver comments approval — the
  in-house replacement for trstringer/manual-approval (infra#62), so no third-party code
  runs in privileged lanes. Opens an issue, polls its comments, and proceeds only when a
  listed approver writes approve/approved/lgtm/yes; deny/denied/no (or the deadline) fails
  the step. Comment authors NOT on the approvers list are ignored entirely, so a drive-by
  comment can neither release nor cancel the gate. Requires `issues: write` on the job and
  a GH_TOKEN (the ambient github.token) — no new secret.
inputs:
  approvers:
    description: Comma-separated GitHub logins whose comments count. Required.
    required: true
  issue-title:
    description: Title for the approval issue.
    required: true
  issue-body:
    description: Body for the approval issue (what is being approved, stated plainly).
    required: true
  timeout-minutes:
    description: How long to wait before giving up (fail closed). Keep <= the job timeout.
    required: false
    default: "50"
  poll-seconds:
    description: Seconds between comment polls.
    required: false
    default: "15"
runs:
  using: composite
  steps:
    - name: Open the approval issue and wait
      shell: bash
      env:
        APPROVERS: ${{ inputs.approvers }}
        ISSUE_TITLE: ${{ inputs.issue-title }}
        ISSUE_BODY: ${{ inputs.issue-body }}
        TIMEOUT_MIN: ${{ inputs.timeout-minutes }}
        POLL_S: ${{ inputs.poll-seconds }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        body="$(printf '%s\n\n---\nRun awaiting this approval: %s\nApprovers: %s\nReply `approve`/`approved`/`lgtm`/`yes` to proceed, `deny`/`denied`/`no` to cancel.' \
          "$ISSUE_BODY" "$RUN_URL" "$APPROVERS")"
        url="$(gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body "$body")"
        num="${url##*/}"
        echo "::notice::awaiting approval on $url (timeout ${TIMEOUT_MIN}m)"

        # Poll comments; only authors on the allowlist count, matched as whole logins.
        deadline=$(( $(date +%s) + TIMEOUT_MIN * 60 ))
        verdict=""
        while [ "$(date +%s)" -lt "$deadline" ]; do
          # login<TAB>body per comment, newlines in bodies flattened.
          while IFS=$'\t' read -r login text; do
            [ -n "$login" ] || continue
            case ",$APPROVERS," in *",$login,"*) ;; *) continue ;; esac
            word="$(printf '%s' "$text" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            case "$word" in
              approve|approved|lgtm|yes) verdict="approved by $login"; break ;;
              deny|denied|no)            verdict="DENIED by $login";   break ;;
            esac
          done < <(gh api "repos/$REPO/issues/$num/comments?per_page=100" \
                    --jq '.[] | [.user.login, (.body | gsub("\\s+"; " "))] | @tsv' || true)
          [ -z "$verdict" ] || break
          sleep "$POLL_S"
        done

        if [ "${verdict#approved}" != "$verdict" ]; then
          gh issue close "$num" --repo "$REPO" --comment "✅ ${verdict} — proceeding. $RUN_URL"
          echo "::notice::${verdict}"
          exit 0
        fi
        if [ -z "$verdict" ]; then verdict="timed out after ${TIMEOUT_MIN}m with no approval"; fi
        gh issue close "$num" --repo "$REPO" --comment "⛔ ${verdict} — run cancelled. $RUN_URL"
        echo "::error::await-approval: ${verdict}"
        exit 1
