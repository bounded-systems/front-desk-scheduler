name: release-ticket
# The other half of the ticket window (#104): let a Claude Code cloud session
# GIVE BACK a lease it took through `claim-ticket.yml`.
#
# WHY THIS EXISTS
# ---------------
# Exactly the same reason as the claim window, one verb over. A session's
# `GH_TOKEN` is the sentinel `proxy-injected`, so `POST /release` refuses in the
# router just as `POST /claim` does — the `release` verb is registered and fine,
# it is the IDENTITY that is missing. Until this file existed,
# `docs/claiming-from-a-session.md` said so under "What is not covered": a
# session could take a lease and then had no way to give it back.
#
# WHAT THAT COST, MEASURED
# ------------------------
# 2026-08-03: a session claimed #93 at 16:05 with the default ttl=3600, finished
# and merged the work at 16:13 (#103, which auto-closed #93), and the lease was
# still held until 17:05 — 52 minutes on a closed item with nobody working it.
# The TTL was not mis-tuned. The item finished early and there was no way to say
# so. Whether the lease should be time-based AT ALL is #105; this file is the
# narrower fact that the only path which could end one early was unreachable.
#
# WHY `fencing` IS REQUIRED AND NOT INFERRED
# ------------------------------------------
# `decideRelease` (worker/lease/src/lease-core.mjs) refuses a release whose
# fencing token is stale, and that check is load-bearing: without it a zombie
# that woke up and released would free the lease belonging to the NEW holder,
# handing the item to a third agent while the second was still working. So the
# caller must present the token it was granted. This workflow passes it through
# and does NOT look it up — looking it up would reconstruct the caller's belief
# from current state, which is precisely the belief being checked.
#
# The token is in the `FDS-CLAIM-RESULT` line of the claim run that granted it.
#
# ONE DEFINITION
# --------------
# Shells out to the same `release` verb the CLI and MCP expose (#59). The only
# things this file adds are the identity and a parseable verdict.
on:
  workflow_dispatch:
    inputs:
      agent_label:
        description: >-
          The SAME label you claimed with, e.g. "session-7". The Worker
          namespaces it under the verified identity, so it must match the
          holder it recorded (`gha/<label>`) or the release is refused.
        required: true
        type: string
      item_id:
        description: 'The project item id from the claim verdict, e.g. "PVTI_lADO…".'
        required: true
        type: string
      fencing:
        description: >-
          The fencing token from the claim's FDS-CLAIM-RESULT line. A release
          without the token you were granted cannot be told apart from a zombie's.
        required: true
        type: string
      status:
        description: 'completed = the work is done; released = handing it back unfinished.'
        required: false
        default: "completed"
        type: choice
        options: ["completed", "released"]

# Nothing here mutates the repo; the lease write leaves GitHub over HTTPS. Read
# is all `github.token` needs — the Worker checks installation coverage of this
# repo, which any installation token can answer regardless of its scopes.
permissions:
  contents: read

concurrency:
  # Serialize per label, matching claim-ticket.yml, so a double-dispatch cannot
  # race itself. Note this does NOT serialize against a claim for the same item
  # by a different label — that contention is the mechanism's point, and the
  # fencing check is what makes it safe rather than a lock.
  group: release-ticket-${{ inputs.agent_label }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      # Same pin the org's repo-standard.yml uses, so there is one SHA to bump.
      - uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d # v1
        with:
          deno-version: v2.x

      - name: Install dependencies (frozen)
        run: deno install --frozen

      - name: Release
        id: release
        env:
          # The whole point of the window: github.token is an installation token
          # covering this repo, which auth.mjs branch 2 accepts.
          GH_TOKEN: ${{ github.token }}
          FDS_CLAIM_ENDPOINT: ${{ vars.FDS_CLAIM_ENDPOINT }}
          # Pinned rather than auto-detected, matching claim-ticket.yml: the
          # runner has no local mirror, so detection would land here anyway.
          FDS_READS: dolthub
          FDS_JSON: "1"
          AGENT_LABEL: ${{ inputs.agent_label }}
          ITEM_ID: ${{ inputs.item_id }}
          FENCING: ${{ inputs.fencing }}
          STATUS: ${{ inputs.status }}
        run: |
          set -uo pipefail

          if [ -z "${FDS_CLAIM_ENDPOINT:-}" ]; then
            echo "::error::FDS_CLAIM_ENDPOINT is unset — there is no lease plane to release against."
            echo "::error::It is published by lease-deploy.yml as a repo/org Actions variable."
            exit 1
          fi

          case "$FENCING" in
            ''|*[!0-9]*)
              echo "::error::fencing must be the integer from the claim's FDS-CLAIM-RESULT line (got '$FENCING')."
              exit 1 ;;
          esac

          args=(release --itemId "$ITEM_ID" --agent "$AGENT_LABEL" --fencing "$FENCING")
          [ "$STATUS" = "completed" ] && args+=(--complete)

          # stdout is the verdict, stderr is the diagnosis. Keep them apart so a
          # transport error cannot be parsed as a refusal.
          set +e
          out="$(node scripts/fds.ts "${args[@]}" 2>/tmp/release.err)"
          rc=$?
          set -e

          if [ $rc -ne 0 ]; then
            # An ERROR is not a refusal. No verdict means the lease's state is
            # unknown — it may still be held — which is a different fact from
            # "the DO declined", and must not be reported as one.
            echo "::error::release failed before a verdict was reached (exit $rc)."
            sed 's/^/::error::/' /tmp/release.err
            node scripts/release-ticket-summary.ts --error "$rc" < /tmp/release.err >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # One greppable line, so a session can read the verdict from the job log
          # without downloading the run summary. Mirrors FDS-CLAIM-RESULT (#61).
          echo "FDS-RELEASE-RESULT $out"
          echo "result=$out" >> "$GITHUB_OUTPUT"

          node scripts/release-ticket-summary.ts "$out" >> "$GITHUB_STEP_SUMMARY"

          # A REFUSAL IS AN ANSWER, so the run succeeds — same call as #61's.
          # Failing here would train a caller to read "someone else holds it" as
          # a broken workflow. The one refusal that deserves louder handling is
          # stale-fencing (the caller is a zombie); it is shouted in the summary
          # and annotated here, but it still is not a workflow failure.
          if [ "$(printf '%s' "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);process.stdout.write(String(!v.released&&v.reason==="stale-fencing"))})')" = "true" ]; then
            echo "::warning::release refused as stale-fencing — a newer grant exists. STOP working this item."
          fi
