name: deps
# Dependency scanning, via the org's shared lane (infra#104).
#
# WHY THIS IS A CALLER AND NOT A LOCAL COPY
# -----------------------------------------
# The scanner version and its sha256 are a matched pair pinned inside the reusable
# workflow. Copying the job here would mean a second place to bump them, and the two
# would drift — which is exactly the shape infra-test.yml's inline `deps` job is in
# today. One definition, many callers.
#
# WHY NOT THE ORG'S required-baseline.yml
# ---------------------------------------
# bounded-systems/.github/required-baseline.yml claims to be "the enforced security
# FLOOR for every repo", injected on every PR by an org ruleset's `workflows` rule.
# It is NOT injected and has never run: the only org rulesets reaching this repo are
# `default-branch-protection` and `protect important repos`, neither of which carries
# a `workflows` rule, and `required-baseline` appears zero times in this repo's run
# history. Ruleset-injected required workflows are an Enterprise feature and this org
# is on Free — the same class of limit that already blocked environment
# required-reviewers (infra/github-admin/README.md). So until the plan changes,
# adoption has to be an explicit `uses:` like this one.
#
# WHAT THIS ACTUALLY COVERS HERE — READ BEFORE TRUSTING A GREEN CHECK
# -------------------------------------------------------------------
# osv-scanner has no deno.lock extractor, but since ci-workflows#1 the shared lane
# converts the lock's npm subset to a CycloneDX SBOM in-lane and scans that: for this
# repo that is 103 of the ~110 lock entries, alongside specs/rust/Cargo.lock (31) and
# specs/shacl/requirements.txt (2). Still NOT scanned, and logged as such per run:
# jsr-native deps and @jsr/* npm-compat mirrors — OSV has no JSR ecosystem, so no
# scanner can cover those today. A green check means the npm graph was examined, not
# the JSR one. Tracked in infra#104.
#
# NOT path-filtered, deliberately — same reasoning as test.yml and schema-drift.yml:
# a check that is skipped on some PRs cannot be made a required check without the
# skipped-required-check problem.
on:
  pull_request:
  push:
    branches: [main]
  # Weekly rescan, matching templates/deps.yml. Advisories are published against
  # locks that are not changing, so a repo that merges rarely would otherwise stay
  # green on stale information indefinitely. Tuesday, one day after ci-workflows'
  # Monday self-test — that canary catches a broken digest or release URL
  # fleet-wide BEFORE the fleet rescans on it.
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch: {}
concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  osv:
    # SHA-pinned per org policy. `# main` records what the SHA was at the time, so a
    # reviewer can tell an intentional bump from a drifted one.
    uses: bounded-systems/ci-workflows/.github/workflows/osv-scan.yml@46f8d50be74f62024eceb1307ce7dc5e7d372da1 # main
