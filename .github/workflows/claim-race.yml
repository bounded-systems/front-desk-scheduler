name: claim-race
# Race real concurrent claimants and require exactly one winner.
#
# WHAT THIS FILE USED TO GET WRONG
# --------------------------------
# It called itself "the empirical A1/A2 gate" and provisioned its own
# `dolt sql-server`. So it measured a topology that does not exist: CI satisfied
# A2 (one serialization point) by construction, the race passed, and the green
# was an artifact of the harness rather than evidence about production. In
# production `DOLT_HOST` is unset, `writesGoToServer()` is false, claim writes go
# to a LOCAL CLONE, and `leases.item_id`'s PRIMARY KEY excludes only within one
# database — of which there are as many as there are agents.
#
# A green test whose green-ness comes from the harness is worse than no test: it
# reports the assumption as discharged. So the two questions are now separate
# jobs, and only one of them is evidence about production.
#
#   harness-a1   — self-provisioned server. Tests A1 (does the ENGINE make
#                  INSERT IGNORE atomic under contention?) and the seam's own
#                  mechanics. Real signal; this is where the TOCTOU commit guard
#                  and the unhandled 40001 retries were caught. NOT evidence
#                  about production topology, and no longer claims to be.
#
#   lease-integration — races the REAL worker/lease under a local `wrangler dev`
#                  (workerd): real Durable Object SQLite storage, real input-gate
#                  serialization, real HTTP. Establishes A1' (the RUNTIME, not a
#                  fake single-threaded storage, applies one transition at a time)
#                  and that the DEPLOYED code excludes — closing the gap between
#                  lease-core.test.mjs (pure core proven) and production-a2. Like
#                  harness-a1 it PROVISIONS its own single instance, so it does
#                  NOT establish A2. Strictly stronger than the in-process stub
#                  (worker/lease/src/index.test.mjs), strictly weaker than
#                  production-a2 — and labelled as neither. Needs no endpoint, no
#                  credential, no deploy.
#
#   production-a2 — points at the deployed serialization endpoint. Provisions
#                  NOTHING. Red until one exists, which is the honest state:
#                  A2 is currently ASSERTED, not discharged.
#
# ACCEPTANCE CRITERION for the Durable Object work (docs/queue-vs-log.md):
# production-a2 goes green — N agents against the real endpoint, exactly one
# grant. Until that run happens, "the DO enforces exclusion" is a design claim.
#
# `worker/**` is in the path filter for that reason: the DO is this test's
# SUBJECT. It was missing when the DO first landed, so edits to the
# serialization mechanism did not trigger the test meant to gate it.
on:
  pull_request:
    # NB: duplicated below rather than shared with a YAML anchor — GitHub
    # Actions does not support anchors/aliases in workflow files.
    paths:
      - "src/mirror.ts"
      - "src/dolt-server.ts"
      - "src/scheduling.ts"
      - "schema/**"
      - "scripts/claim-race.ts"
      - "scripts/lease-integration.sh"
      - "src/lease-client.ts"
      - "src/claim-plane.ts"
      - "worker/**"
      - ".github/workflows/claim-race.yml"
  push:
    branches: [main]
    paths:
      - "src/mirror.ts"
      - "src/dolt-server.ts"
      - "src/scheduling.ts"
      - "schema/**"
      - "scripts/claim-race.ts"
      - "scripts/lease-integration.sh"
      - "src/lease-client.ts"
      - "src/claim-plane.ts"
      - "worker/**"
      - ".github/workflows/claim-race.yml"
  schedule:
    - cron: "23 6 * * *" # daily; production-a2 is a standing signal, not a one-off
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Serialization endpoint to race (a worker/lease URL). Overrides the FDS_CLAIM_ENDPOINT variable."
        required: false
        default: ""
        type: string
concurrency:
  group: claim-race-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # ── A1 + seam mechanics ─────────────────────────────────────────────────────
  harness-a1:
    name: harness (A1 — engine atomicity, NOT production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      - name: Install deno + deps from the lock
        run: |
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$HOME/.deno" sh -s -- -y
          "$HOME/.deno/bin/deno" install --frozen
      - name: Install dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version
      - name: Seed a scratch mirror and start a sql-server
        # Scratch server, not the GHCR image: the race needs a WRITABLE database
        # seeded from schema/mirror.sql, whereas the image serves a read replica
        # of the public mirror. No credential, no network beyond installs.
        run: |
          set -euo pipefail
          dolt config --global --add user.name "claim-race"
          dolt config --global --add user.email "race@front-desk"
          mkdir -p /tmp/race/mirror && cd /tmp/race/mirror
          dolt init -b main
          dolt sql < "$GITHUB_WORKSPACE/schema/mirror.sql"
          dolt sql -q "INSERT INTO items (item_id,number,title,repository,status,kind) VALUES ('race#1',1,'contended item','prx','Todo','task')"
          cd /tmp/race
          nohup dolt sql-server --host 127.0.0.1 --port 3311 >server.log 2>&1 &
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -P3311 -uroot --silent 2>/dev/null; then break; fi; sleep 1
          done
          echo "server up"
      - name: "Race: 16 agents, then 32"
        env:
          DOLT_HOST: 127.0.0.1
          DOLT_PORT: "3311"
          DOLT_DB: mirror
          DOLT_USER: root
          DOLT_PASSWORD: ""
        run: |
          set -euo pipefail
          node scripts/claim-race.ts
          RACE_AGENTS=32 node scripts/claim-race.ts
      - name: Server log on failure
        if: failure()
        run: tail -50 /tmp/race/server.log || true
      - name: Say what this did and did not establish
        if: always()
        run: |
          {
            echo "### harness-a1"
            echo "Raced against a server this job started itself."
            echo ""
            echo "Establishes: **A1** — the engine adjudicates \`INSERT IGNORE\` atomically"
            echo "against the PRIMARY KEY under real contention — and that the seam's"
            echo "commit/retry mechanics hold."
            echo ""
            echo "Does NOT establish **A2**. This job creates the single serialization"
            echo "point it then relies on. See \`production-a2\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── real Worker, local topology ─────────────────────────────────────────────
  lease-integration:
    name: lease-integration (real Worker excludes under HTTP — NOT A2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      - uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d # v1
        with:
          deno-version: v2.x
      - name: Install deps from the lock (frozen)
        # The racer imports src/mirror.ts + src/claim-plane.ts; deno.lock is the
        # single pin for what those resolve to. wrangler is fetched separately via
        # npx inside the script — it is a dev-only tool, not a tracked dependency.
        run: deno install --frozen
      - name: Race the real Worker under a local workerd
        # Starts worker/lease under `wrangler dev`, waits for /health, then points
        # scripts/claim-race.ts (the production-a2 racer) at it via the lease plane.
        run: bash scripts/lease-integration.sh
      - name: Say what this did and did not establish
        if: always()
        run: |
          {
            echo "### lease-integration"
            echo "Raced the REAL \`worker/lease\` under a local \`wrangler dev\` (workerd) over HTTP."
            echo ""
            echo "Establishes: **A1'** — the runtime (real Durable Object storage + input"
            echo "gates), not a fake single-threaded storage, applies one transition at a time,"
            echo "and the DEPLOYED code grants exactly one claim among N concurrent HTTP"
            echo "claimants. Strictly stronger than the in-process stub"
            echo "(\`worker/lease/src/index.test.mjs\`)."
            echo ""
            echo "Also establishes that the worker **fails closed** as shipped: before the"
            echo "race, an unauthenticated write against the SHIPPED config is refused 401"
            echo "and leaves the item unheld. The race itself then runs under"
            echo "\`AUTH_MODE=none\` — the scratch-deployment escape hatch — so exclusion is"
            echo "measured without a live api.github.com round-trip inside every claim."
            echo ""
            echo "Does NOT establish **A2**. Like \`harness-a1\`, this job provisions the single"
            echo "serialization point it relies on — one local workerd is one instance by"
            echo "construction. A2 (every claimant reaches ONE GLOBAL instance) is discharged"
            echo "only by \`production-a2\` against the deployed endpoint."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── A2 against real topology ────────────────────────────────────────────────
  production-a2:
    name: production (A2 — one serialization point, for real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      - name: Resolve the serialization endpoint
        # Deliberately NOT provisioned. The whole defect this job exists to expose
        # is a test that manufactures its own premise.
        id: endpoint
        env:
          FROM_INPUT: ${{ inputs.endpoint }}
          FROM_VAR: ${{ vars.FDS_CLAIM_ENDPOINT }}
        run: |
          set -uo pipefail
          ep="${FROM_INPUT:-}"
          [ -n "$ep" ] || ep="${FROM_VAR:-}"
          if [ -z "$ep" ]; then
            echo "::error::No serialization endpoint configured (FDS_CLAIM_ENDPOINT is unset)."
            echo "::error::"
            echo "::error::This job is RED BY DESIGN until one exists, and that red is accurate:"
            echo "::error::production claim writes currently go to a LOCAL CLONE per agent, so"
            echo "::error::leases.item_id's PRIMARY KEY excludes within one database and there is"
            echo "::error::no shared one. A2 in specs/lean/Leases.lean is ASSERTED, not discharged."
            echo "::error::"
            echo "::error::Turning this green is the acceptance criterion for the Durable Object"
            echo "::error::work — see docs/queue-vs-log.md. Do NOT satisfy it by provisioning a"
            echo "::error::server inside this job; that is exactly the bug this replaced."
            {
              echo "### ⛔ production-a2 — no endpoint"
              echo "A2 is asserted, not discharged. Claim writes go to per-agent local clones."
              echo "Set \`FDS_CLAIM_ENDPOINT\` once a real serialization point is deployed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "endpoint=$ep" >> "$GITHUB_OUTPUT"
          echo "::notice::racing against $ep"

      - name: Install deno + deps from the lock
        run: |
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$HOME/.deno" sh -s -- -y
          "$HOME/.deno/bin/deno" install --frozen

      - name: "Race the real endpoint: 16 agents, then 32"
        # FDS_CLAIM_ENDPOINT, not DOLT_HOST. This job originally passed the
        # endpoint as a MySQL host because it was written before the Durable
        # Object was chosen — which would have produced a connection failure
        # against an HTTP DO, i.e. red for the WRONG REASON. A red that cannot
        # distinguish "A2 undischarged" from "wrong protocol" is worth about as
        # much as the green that came from CI provisioning its own server.
        env:
          FDS_CLAIM_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
          RACE_ITEM: ${{ vars.FDS_CLAIM_RACE_ITEM || 'race#1' }}
          # The worker authenticates writes (worker/lease/src/auth.mjs). This
          # job's own github.token is an installation token covering this repo,
          # which is exactly the grant the worker checks — no new secret.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/claim-race.ts
          RACE_AGENTS=32 node scripts/claim-race.ts

      - name: Record what this establishes
        if: success()
        run: |
          {
            echo "### ✅ production-a2"
            echo "N agents raced the DEPLOYED serialization endpoint and exactly one won."
            echo "A2 is discharged by experiment rather than asserted."
          } >> "$GITHUB_STEP_SUMMARY"
