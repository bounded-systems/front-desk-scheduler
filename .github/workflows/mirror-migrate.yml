name: mirror-migrate
# Apply a pending schema migration to the deployed Dolt mirror.
#
# WHY THIS IS A WORKFLOW AND NOT SOMETHING A SESSION DOES DIRECTLY
# ----------------------------------------------------------------
# The broker's trust boundary is a GitHub Actions OIDC JWT: `verifyOIDC` pins
# iss, aud, repository_owner, repository AND `job_workflow_ref` (which carries
# `@refs/heads/main`). Only a specific workflow file, running on main, can obtain
# credentials. That is the property that makes "no stored secret" true.
#
# A Claude Code cloud session is not an Actions runner. It has no
# ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN and cannot mint a GitHub-signed OIDC token,
# so it cannot authenticate to the broker at all — by design, not by oversight.
# Handing the session a long-lived credential instead would destroy exactly the
# property the broker exists to provide, and would put a writable production
# credential inside a process that reads untrusted issue text.
#
# So the session does not get credentials. It gets a BUTTON: it dispatches this
# workflow, which runs with its own pinned identity, fetches the credential over
# OIDC, does the write, and leaves the audit trail in Actions. The privileged
# thing stays where it can be pinned and reviewed.
#
# ⚠ SETUP REQUIRED BEFORE THIS CAN RUN (both fail closed until done):
#   1. Add this file's job_workflow_ref to the broker's allowed refs:
#        bounded-systems/front-desk-scheduler/.github/workflows/mirror-migrate.yml@refs/heads/main
#      Until then the broker returns 401 and this workflow cannot get a credential.
#   2. Create the `mirror-write` GitHub Environment with REQUIRED REVIEWERS.
#      Dispatch alone must not be able to mutate the production database; the
#      reviewer gate is the actual control, and the environment claim is signed
#      by GitHub so it cannot be forged.
#   3. (for the projection PR only) Add the same job_workflow_ref to the
#      broker's GH_APPS allowlist for app `front-desk`, so this workflow can
#      mint an App installation token and open the PR as the App.
#
#      STATUS 2026-07-28 — allowlist DONE, App permission NOT. Run 30373059795
#      minted the App token successfully (broker side works), then `gh pr create`
#      failed with:
#        GraphQL: Resource not accessible by integration (createPullRequest)
#      That is the App installation lacking `Pull requests: write` on this repo.
#      The migration applied and pushed; only the PR step degraded, and the
#      branch was pushed so a human could open it (PR #27).
#
#      PR #27 then hit a SECOND, unrelated wall: `Commits must have verified
#      signatures` blocked the merge, because the projection commit was made with
#      `git commit` on the runner. It was merged with a rule bypass. The
#      publication step below now writes through the Contents API so GitHub
#      constructs (and can sign) the commit — see that step's header, including
#      why it verifies the result rather than trusting the endpoint.
#
#      ⚠ Note the fallback below is NOT a retry. `GH_TOKEN` is
#      `${{ steps.apptoken.outputs.token || github.token }}`, which resolves at
#      expression-evaluation time — when the App token EXISTS, GITHUB_TOKEN is
#      never tried, even if the App token is then rejected. So "App token, else
#      GITHUB_TOKEN" describes token SELECTION, not failure recovery. A true
#      retry would need a second `gh pr create` under `github.token`. Left as
#      selection deliberately for now: the org setting that would make the
#      GITHUB_TOKEN path work bundles "approve" with "create" and would let any
#      workflow self-approve PRs, which is worse than opening one PR by hand.
#
#      The App token remains preferred: the PR is authored by the Front Desk App
#      rather than github-actions[bot], and it does not rely on an org-wide
#      setting that also grants the APPROVE half. Worth knowing before turning on
#      branch protection — verify whether an Actions approval can satisfy a
#      required CODEOWNERS review in your configuration, rather than assuming.
on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Migration file in schema/migrations/ (e.g. 2026-07-27-leases.sql)"
        required: true
        type: string
      # WHAT A DRY RUN ACTUALLY VERIFIES — it does NOT produce a plan.
      #
      # Every mutating step below is gated on `dry_run == false`, so a dry run
      # does exactly four things: validates the migration file exists (and cats
      # it), installs dolt, FETCHES THE DOLTHUB CREDENTIAL FROM THE BROKER, and
      # clones the mirror. There is no simulation, no diff, no "rows affected" —
      # nothing to compare against expectations. Do not read a green dry run as
      # "the migration will do what I want"; it cannot tell you that.
      #
      # What it IS uniquely good for: the credential step carries no dry_run
      # guard, so a green dry run proves the whole OIDC path works end to end —
      # the job_workflow_ref is on the broker's allowlist and a real credential
      # came back — WITHOUT touching production. That makes it the cheapest way
      # to confirm a newly-added allowlist entry is live. Used exactly that way
      # on 2026-07-28 to confirm the entry before applying.
      dry_run:
        description: "Validate the file + broker credential path without applying (produces NO plan)"
        required: false
        default: true
        type: boolean
concurrency:
  group: mirror-write # never race the syncer or another migration
  cancel-in-progress: false
permissions:
  id-token: write # OIDC → broker
  contents: write # push the regenerated projection branch
  pull-requests: write # open the PR that records the new reality
jobs:
  migrate:
    runs-on: ubuntu-latest
    # The reviewer gate. `deriveEdit`-style environment claims are signed by
    # GitHub, so entering this environment is a fact the broker can trust.
    environment: mirror-write
    env:
      DOLTHUB_DB: bounded-systems/front-desk-mirror
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      - name: Validate the requested migration exists
        # Do this BEFORE touching any credential: a typo should fail with no
        # secret in the environment.
        run: |
          set -euo pipefail
          f="schema/migrations/${{ inputs.migration }}"
          case "${{ inputs.migration }}" in
            */*|..*) echo "::error::migration must be a bare filename"; exit 1 ;;
          esac
          [ -f "$f" ] || { echo "::error::no such migration: $f"; exit 1; }
          echo "--- $f ---"; cat "$f"

      - name: Install dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version

      - name: DoltHub credential (via OIDC broker)
        env:
          BROKER_URL: ${{ vars.FRONT_DESK_BROKER_URL }}
        run: |
          set -euo pipefail
          [ -n "${BROKER_URL:-}" ] || { echo "::error::FRONT_DESK_BROKER_URL not set"; exit 1; }
          jwt="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dolthub-cred-broker" | jq -r '.value // empty')"
          [ -n "$jwt" ] || { echo "::error::failed to obtain an OIDC token"; exit 1; }
          jwk="$(curl -fsS -X POST -H "Authorization: Bearer ${jwt}" \
            "${BROKER_URL%/}/dolthub/front-desk-mirror" | jq -r '.jwk // empty')"
          [ -n "$jwk" ] || { echo "::error::broker returned no DoltHub credential (is this workflow's job_workflow_ref on the broker allowlist?)"; exit 1; }
          umask 077; printf '%s' "$jwk" > /tmp/cred.jwk
          dolt creds import /tmp/cred.jwk
          rm -f /tmp/cred.jwk
          dolt config --global --add user.name "front-desk-mirror-migrate"
          dolt config --global --add user.email "1240090+bdelanghe@users.noreply.github.com"

      - name: Force IPv4 for DoltHub remote API
        # Hosted runners have no IPv6 route; dolt dials the AAAA record and dies.
        run: |
          set -euo pipefail
          ip="$(dig +short A doltremoteapi.dolthub.com | grep -E '^[0-9.]+$' | head -1)"
          [ -n "$ip" ] || { echo "::error::could not resolve doltremoteapi.dolthub.com"; exit 1; }
          echo "$ip doltremoteapi.dolthub.com" | sudo tee -a /etc/hosts

      - name: Clone mirror
        run: dolt clone "$DOLTHUB_DB" mirror

      - name: Apply migration
        if: ${{ inputs.dry_run == false }}
        # Idempotency lives in the `schema_migrations` ledger, NOT inside each
        # migration file. Dolt cannot express conditional DDL — `ADD COLUMN IF
        # NOT EXISTS` is MariaDB-only, `PREPARE` silently refuses DDL, and
        # `DATABASE()` is empty under `dolt sql`, so an information_schema guard
        # cannot work either. A file that ALTERs a table therefore cannot be
        # written to survive a second run; the runner has to skip it instead.
        run: |
          set -euo pipefail
          cd mirror
          M="${{ inputs.migration }}"

          # The ledger must exist before it can be consulted (it will not on a
          # mirror that predates it). CREATE TABLE IF NOT EXISTS is supported.
          dolt sql -q "CREATE TABLE IF NOT EXISTS \`schema_migrations\` (
            \`filename\`   varchar(255) NOT NULL,
            \`applied_at\` datetime     NOT NULL,
            PRIMARY KEY (\`filename\`)
          )"

          applied="$(dolt sql -r csv -q \
            "SELECT COUNT(*) AS n FROM \`schema_migrations\` WHERE \`filename\` = '$M'" \
            | tail -1)"
          if [ "$applied" != "0" ]; then
            echo "::notice::$M is already recorded in schema_migrations — skipping (nothing to do)"
            exit 0
          fi

          dolt sql < "../schema/migrations/$M"
          # Record it in the SAME commit as its effects, so the ledger can never
          # disagree with the schema it describes.
          dolt sql -q "INSERT INTO \`schema_migrations\` (\`filename\`, \`applied_at\`)
                       VALUES ('$M', UTC_TIMESTAMP())"

          dolt add -A

          # Diagnostics first: the previous attempt reported success while
          # changing nothing, because the old guard parsed `dolt diff` output
          # inside an `if`. Under `set -o pipefail` a FAILING dolt diff is
          # indistinguishable from an empty one — both take the else branch —
          # so a broken guard silently looked like "no changes".
          echo "--- dolt status ---"
          dolt status
          echo "--- staged/unstaged entries (dolt_status) ---"
          changed="$(dolt sql -r csv -q 'SELECT COUNT(*) AS n FROM dolt_status' | tail -1)"
          echo "dolt_status rows: ${changed:-<none>}"

          # The ledger already told us this file was NOT applied. If applying it
          # changed nothing, something is wrong — fail loudly rather than push a
          # no-op and report success.
          if [ "${changed:-0}" -eq 0 ] 2>/dev/null; then
            echo "::error::$M is unrecorded in schema_migrations yet produced NO change."
            echo "::error::Refusing to report success. Inspect the dolt status output above."
            exit 1
          fi

          dolt commit -m "schema: apply $M"

      - name: Push mirror → DoltHub
        if: ${{ inputs.dry_run == false }}
        run: cd mirror && dolt push origin main

      - name: Regenerate the checked-in projection
        # Applying a migration makes schema/mirror.live.sql stale, which turns the
        # schema-drift gate red. Regenerate here so the two land together.
        if: ${{ inputs.dry_run == false }}
        run: node scripts/schema-export.ts

      - name: Front Desk App token (via OIDC broker)
        # `gh pr create` with the Actions GITHUB_TOKEN is refused when the org
        # disables "Allow GitHub Actions to create and approve pull requests":
        #   GraphQL: GitHub Actions is not permitted to create or approve pull
        #   requests (createPullRequest)
        # A GitHub App installation token is NOT subject to that restriction, and
        # it is how mirror-sync.yml already authenticates — so the PR is opened by
        # the Front Desk App rather than by github-actions[bot], with App identity
        # in the audit trail. Crucially this ALSO avoids enabling the repo
        # checkbox, which bundles "create" together with "approve" and would let
        # any workflow self-approve PRs — undermining the CODEOWNERS gate.
        #
        # Minted LATE, immediately before use: the migration has already applied
        # by this point, so a token failure cannot cost us the write.
        #
        # ⚠ Requires this workflow's job_workflow_ref on the broker's GH_APPS
        # allowlist for app `front-desk`. Until that is deployed the step below
        # falls back to GITHUB_TOKEN and then to a warning — it never fails the
        # run, because the migration itself has already succeeded.
        id: apptoken
        if: ${{ inputs.dry_run == false }}
        continue-on-error: true
        env:
          BROKER_URL: ${{ vars.FRONT_DESK_BROKER_URL }}
        run: |
          set -uo pipefail
          [ -n "${BROKER_URL:-}" ] || { echo "::warning::FRONT_DESK_BROKER_URL not set"; exit 0; }
          jwt="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github-app-broker" | jq -r '.value // empty')" || true
          [ -n "${jwt:-}" ] || { echo "::warning::could not obtain an OIDC token for the App broker"; exit 0; }
          tok="$(curl -fsS -X POST -H "Authorization: Bearer ${jwt}" \
            "${BROKER_URL%/}/github/front-desk" | jq -r '.token // empty')" || true
          if [ -z "${tok:-}" ]; then
            echo "::warning::broker returned no App token (is mirror-migrate.yml on the GH_APPS allowlist?)"
            exit 0
          fi
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      - name: Publish the projection and open the PR that records the new reality
        # WHY THE COMMIT IS WRITTEN THROUGH THE API AND NOT WITH `git commit`
        # -----------------------------------------------------------------
        # This step used to `git config user.*`, `git commit`, `git push`. That
        # produces an UNSIGNED commit, because Actions hands a job a token, not a
        # signing key — there is nothing on the runner to sign with. When the
        # `Commits must have verified signatures` rule was turned on for main,
        # PR #27 was blocked and had to be merged with a rule bypass.
        #
        # A commit created through the Contents API is CONSTRUCTED SERVER-SIDE,
        # which is the precondition for GitHub signing it with its own key. Same
        # content, same branch, same PR — the difference is who assembles the
        # commit object.
        #
        # ⚠ "written through the API" does NOT by itself imply "signed". Verified
        # on 2026-07-28 from a session whose Contents API write came back
        # `%G? = N` (no signature at all) while GitHub's own squash-merges on the
        # same repo are signed as `GitHub <noreply@github.com>`. Signing depends
        # on the authenticating identity, not merely on the endpoint. So this
        # step CHECKS the resulting commit's verification instead of assuming it
        # — the whole point is not to ship another proof whose precondition the
        # implementation quietly fails to satisfy.
        if: ${{ inputs.dry_run == false }}
        env:
          # Prefer the App token; fall back to GITHUB_TOKEN (which works only if
          # the repo checkbox is enabled). Either way the step degrades to a
          # warning rather than failing a migration that already succeeded.
          GH_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          MIGRATION: ${{ inputs.migration }}
          BASE_SHA: ${{ github.sha }}
        run: |
          # NOT `-e`: every failure past this point must degrade to a warning.
          # The migration has ALREADY applied and pushed, so a red run here would
          # misreport succeeded work — the "green run that did nothing" confusion
          # in reverse.
          set -uo pipefail

          if git diff --quiet -- schema/mirror.live.sql; then
            echo "::notice::projection unchanged — no PR needed"
            exit 0
          fi
          branch="schema/live-after-${MIGRATION%.sql}"

          degrade() {
            echo "::warning::$1"
            echo "::warning::THE MIGRATION APPLIED AND PUSHED SUCCESSFULLY — only publication failed."
            echo "::warning::Regenerate locally with 'node scripts/schema-export.ts' and open the PR by hand."
            {
              echo "### ⚠ projection not published"
              echo "The migration applied and pushed. \`schema/mirror.live.sql\` is stale on main"
              echo "until someone regenerates it, so \`schema-drift\` will be red."
              echo ""
              echo "- reason: $1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # 1. The branch. Point it at the commit this run checked out, so the
          #    projection diff is against the same tree the export ran on.
          if ! gh api -X POST "repos/$REPO/git/refs" \
                 -f ref="refs/heads/$branch" -f sha="$BASE_SHA" >/dev/null 2>&1; then
            echo "::notice::branch $branch already exists — writing onto it"
          fi

          # 2. The Contents API needs the blob sha it is replacing, read from the
          #    branch (not from main — they differ once the branch exists).
          blob="$(gh api "repos/$REPO/contents/schema/mirror.live.sql?ref=$branch" --jq .sha)" \
            || degrade "could not read the current projection blob on $branch"
          [ -n "${blob:-}" ] || degrade "empty blob sha for schema/mirror.live.sql on $branch"

          # 3. The write. GitHub assembles this commit, so GitHub can sign it.
          commit="$(gh api -X PUT "repos/$REPO/contents/schema/mirror.live.sql" \
            -f message="schema: regenerate projection after $MIGRATION" \
            -f branch="$branch" \
            -f sha="$blob" \
            -f content="$(base64 -w0 schema/mirror.live.sql)" \
            --jq .commit.sha)" \
            || degrade "Contents API write failed"
          # A 2xx with no commit sha would mean "wrote nothing" while looking
          # like success — the exact failure shape this workflow already got
          # burned by once, in the migration guard.
          [ -n "${commit:-}" ] || degrade "Contents API returned no commit sha"
          echo "::notice::wrote projection as $commit on $branch"

          # 4. Verify, do not assume. An unsigned commit here is not fatal — the
          #    content is right and a human can still merge with a bypass — but it
          #    must be VISIBLE, because the symptom otherwise appears much later
          #    as an unexplained blocked merge.
          v="$(gh api "repos/$REPO/commits/$commit" --jq '.commit.verification.verified')"
          if [ "$v" = "true" ]; then
            echo "::notice::$commit is signed and verified — mergeable under the signature rule"
          else
            why="$(gh api "repos/$REPO/commits/$commit" --jq '.commit.verification.reason')"
            echo "::warning::$commit is NOT verified (reason: ${why:-unknown})."
            echo "::warning::A 'Commits must have verified signatures' rule will BLOCK this PR."
            echo "::warning::Signing depends on the identity that authenticated, so check which"
            echo "::warning::credential this step ran under: '${{ steps.apptoken.outputs.token && 'App token' || 'GITHUB_TOKEN' }}'."
            {
              echo "### ⚠ projection commit is unsigned"
              echo "\`$commit\` came back \`verified: false\` (\`${why:-unknown}\`)."
              echo "If main requires verified signatures this PR cannot merge without a bypass."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          cat > /tmp/pr-body.md <<'BODY'
          Generated by `mirror-migrate` after applying a migration to the deployed mirror.

          The deployed schema changed, so `schema/mirror.live.sql` is regenerated to match.
          Merging this returns the `schema-drift` gate to green.
          BODY
          sed -i 's/^          //' /tmp/pr-body.md
          {
            echo ""
            echo "Migration: \`${{ inputs.migration }}\`"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> /tmp/pr-body.md
          # Degrade gracefully. The migration has ALREADY applied and pushed by
          # this point — failing here would report a red run for work that
          # actually succeeded, which is exactly the "green run that did
          # nothing" confusion in reverse. Seen in production: the org may
          # disable "Allow GitHub Actions to create and approve pull requests",
          # in which case gh exits non-zero with
          #   GraphQL: GitHub Actions is not permitted to create or approve
          #   pull requests (createPullRequest)
          # The branch exists regardless, so a human can open the PR.
          #
          # --head/--base are REQUIRED here. gh infers them from the checked-out
          # branch, and since the commit is now written through the API this job
          # never checks the branch out — it is still sitting on the commit that
          # actions/checkout left. Without --head, gh would target main.
          if gh pr create --draft \
               --head "$branch" --base "${{ github.ref_name }}" \
               --title "schema: projection after ${{ inputs.migration }}" \
               --body-file /tmp/pr-body.md; then
            echo "::notice::projection PR opened"
          else
            echo "::warning::could not open the projection PR."
            echo "::warning::THE MIGRATION APPLIED AND PUSHED SUCCESSFULLY — only the PR step failed."
            echo "::warning::Open it by hand from the pushed branch: $branch"
            echo "::warning::  ${{ github.server_url }}/${{ github.repository }}/compare/$branch?expand=1"
            echo "::warning::"
            echo "::warning::WHICH credential failed — GH_TOKEN above is ONE of these, not both:"
            echo "::warning::  '${{ steps.apptoken.outputs.token && 'App token' || 'GITHUB_TOKEN' }}' was used."
            echo "::warning::The '||' in GH_TOKEN resolves at expression time, so if the App token"
            echo "::warning::step succeeded, GITHUB_TOKEN was NEVER TRIED. Only one attempt happened."
            echo "::warning::"
            echo "::warning::Read the gh error above — the two failure modes need opposite fixes:"
            echo "::warning::  'Resource not accessible by integration' → the Front Desk App lacks"
            echo "::warning::     'Pull requests: write' on this repo. Fix it on the App installation."
            echo "::warning::     Enabling the Actions checkbox below will NOT help."
            echo "::warning::  'GitHub Actions is not permitted to create or approve pull requests'"
            echo "::warning::     → the org/repo setting. Prefer fixing the App instead: that checkbox"
            echo "::warning::     bundles 'approve' with 'create' and would let workflows self-approve."
            {
              echo "### ⚠ projection PR not opened"
              echo "The migration applied and pushed. Open the PR manually:"
              echo ""
              echo "${{ github.server_url }}/${{ github.repository }}/compare/$branch?expand=1"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### mirror-migrate"
            echo "- migration: \`${{ inputs.migration }}\`"
            echo "- mode: ${{ inputs.dry_run == true && 'DRY RUN (nothing applied)' || 'APPLIED' }}"
          } >> "$GITHUB_STEP_SUMMARY"
