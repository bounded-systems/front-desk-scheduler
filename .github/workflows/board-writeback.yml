name: board-writeback
# The status-writeback window (#148): let any caller resolve the ONE direction of
# board drift that is mechanically derivable.
#
# WHY A WORKFLOW
# --------------
# Same shape as board-parity.yml (#58) and claim-ticket.yml (#61), and for
# board-parity's reason exactly: a Claude Code cloud session cannot make the
# GitHub call at all. Its GH_TOKEN is the sentinel `proxy-injected`, the real
# credential is injected at the egress proxy, and that proxy is a POLICY POINT —
# ProjectV2 is not in the served set. Verified from a session with a real `gh`
# installed (board-parity.yml carries the full transcript):
#
#   gh api graphql {organization{projectV2}} → 403  "only the pinned set of
#                                                    PR-review operations is served"
#
# The capability was never the blocker. The Front Desk App holds
# `organization_projects:write` — declared in broker-drift.yml's `min_perms_for`
# and asserted by that lane on every run. What was missing was a door. This is
# the door: the workflow holds the identity, the caller holds only the ability to
# ask, and CLAUDE.md's rule applies ("when you find you can't do something, the
# usual right answer is to build a ticket window").
#
# WHAT IT WRITES — A PROJECTION, NOT A REPAIR
# -------------------------------------------
# Status is derived from state the system already holds, so there is exactly one
# authority per component and nothing to merge:
#
#   Done         ⟸ closed_at IS NOT NULL      SCHEDULABLE, the #89 Lean invariant
#   Blocked      ⟸ openBlockers > 0           D2/D3 in the shapes
#   In Progress  ⟸ a held lease               the DO (#135/#115)
#   Todo         ⟸ none of the above
#
# The shapes already said this and only lacked a direction: D2 ("a Blocked item
# must have at least one non-Done dependency") and D3 ("a Todo item with an open
# dependency should be Blocked") are together the biconditional
# Blocked ⟺ openBlockers > 0. src/status.ts states the rule; this file does not
# restate it (#59).
#
# THE LEASE PLANE IS NOT READ, AND THAT IS DELIBERATE
# ---------------------------------------------------
# There is no batch route to the Durable Object (#84), so a whole-board pass
# cannot know who holds what. It passes `null` rather than an empty Set, which
# `deriveStatus` turns into a refusal to touch "In Progress" — an empty Set would
# assert "nothing is held" and downgrade every held card to Todo. So this pass
# derives Done and Blocked, preserves In Progress, and never promotes Todo →
# In Progress until #84 lands a batch route.
#
# WHY `apply` DEFAULTS TO FALSE
# -----------------------------
# This is the only automated path in the repo that mutates the live board, and
# the board is what the whole mirror is derived from. Deriving rather than
# repairing makes the first apply potentially LARGE — every card that disagrees
# with its derived value moves, including cards reading Blocked with nothing in
# the dependency graph to justify them (a D2 violation, which derives to Todo).
# So the first dispatch prints the plan against real data and writes nothing.
# Read it before you dispatch again with apply=true.
#
# The plan is idempotent and guards on the LIVE card status, so a second apply
# run after a successful one writes nothing, and a card dragged by hand while the
# mirror lags is left alone rather than rewritten.
#
# ── PREREQUISITE: THE BROKER ALLOWLIST ────────────────────────────────────────
# `verifyOIDC` pins `job_workflow_ref`, so the broker only releases the Front Desk
# App token to workflow files it knows by name. THIS FILE IS NEW: until
# `board-writeback.yml` is added to the `front-desk` tier's GH_APPS entry in the
# broker's wrangler.jsonc, the mint step returns no token and every run fails at
# that step.
#
# That is the #112 shape — a lane that had never once succeeded because its
# workflowRef was missing from the allowlist, green suite and all. So the mint
# step below names this cause explicitly rather than failing with a bare curl
# error, and the first dispatch of this workflow is the thing that proves the
# allowlist entry landed. Dispatch it; do not assume it.
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the cards. Leave false to print the plan only."
        required: false
        default: false
        type: boolean
      reason:
        description: 'Why this run — recorded in the summary, e.g. "clearing #93/#112".'
        required: false
        default: "manual writeback"
        type: string

permissions:
  id-token: write # OIDC → cf-token-broker, for the Front Desk App token
  contents: read

concurrency:
  # The board is the syncer's source. A write landing mid-pull would be read back
  # inconsistently and spends from the same App bucket board-parity measures, so
  # this joins the existing serialization rather than racing it.
  group: mirror-write
  cancel-in-progress: false

jobs:
  writeback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      # Same pin the org's repo-standard.yml uses, so there is one SHA to bump.
      - uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d # v1
        with:
          deno-version: v2.x

      - name: Install dependencies (frozen)
        run: deno install --frozen

      - name: Mint Front Desk App token via the OIDC broker
        id: broker-token
        env:
          BROKER_URL: ${{ vars.CF_BROKER_URL }}
        run: |
          set -euo pipefail
          [ -n "${BROKER_URL:-}" ] || { echo "::error::org var CF_BROKER_URL not visible to this repo"; exit 1; }
          jwt="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github-app-broker" | jq -r '.value // empty')"
          [ -n "$jwt" ] || { echo "::error::failed to obtain an OIDC token"; exit 1; }
          tok="$(curl -fsS -X POST -H "Authorization: Bearer ${jwt}" \
            "${BROKER_URL%/}/github/front-desk" | jq -r '.token // empty')" || {
            echo "::error::broker refused this workflow. verifyOIDC pins job_workflow_ref — if this is the first run of board-writeback.yml, add it to the front-desk tier GH_APPS entry in the broker wrangler.jsonc. See #112 for what a missing allowlist entry looks like when it goes unnoticed."
            exit 1
          }
          [ -n "$tok" ] || {
            echo "::error::broker returned no token for app 'front-desk' — same allowlist cause as above (job_workflow_ref not recognised for board-writeback.yml)."
            exit 1
          }
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      - name: Status writeback
        id: writeback
        env:
          # The App identity: ProjectV2 + organization_projects:write. A session
          # holds nothing equivalent, which is the whole reason this file exists.
          GH_TOKEN: ${{ steps.broker-token.outputs.token }}
          APPLY: ${{ inputs.apply }}
          REASON: ${{ inputs.reason }}
        # `bash {0}`, NOT the default. Actions runs `run:` as `bash -e {0}`, and
        # `-e` is fatal to this step: every line below the script call exists to
        # report what the script did, so aborting ON a non-zero exit throws away
        # exactly the output that explains it.
        #
        # That is not hypothetical. Run 31020918592 (the first apply) exited 1
        # and logged NOTHING — no per-item result, no FDS-WRITEBACK-RESULT, no
        # summary — because `out="$(...)"` tripped `-e` before `echo "$out"`.
        # A partial write had happened and the log could not say which cards
        # moved. Note the no-verdict fallback below was written FOR that case
        # and was itself unreachable, which is the lesson: a guard downstream of
        # the failure it guards against does not run.
        #
        # `set +e` inside the script would work too; the shell override is
        # preferred because it cannot be undone by a later edit to the body.
        shell: bash {0}
        run: |
          set -uo pipefail

          # apply=false (the default) prints the plan and writes nothing.
          flags=""
          if [ "$APPLY" = "true" ]; then flags="--apply"; fi

          out="$(node scripts/status-writeback.ts $flags 2>&1)"
          rc=$?

          echo "$out"

          # The script already prints FDS-WRITEBACK-RESULT. Re-emit only if it did
          # not — a crash before the verdict must not read as a silent success.
          if ! printf '%s\n' "$out" | grep -q '^FDS-WRITEBACK-RESULT '; then
            echo "FDS-WRITEBACK-RESULT {\"mode\":\"unknown\",\"error\":\"no verdict\",\"exit\":$rc}"
          fi

          {
            echo "## board-writeback — $([ "$APPLY" = "true" ] && echo applied || echo "plan only")"
            echo
            echo "_${REASON}_"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $rc
