name: lease-deploy
# Deploy worker/lease, publish its URL, and prove it excludes.
#
# WHY THIS IS A WORKFLOW AND NOT `npx wrangler deploy` ON SOMEONE'S LAPTOP
# -----------------------------------------------------------------------
# Same argument as mirror-migrate. A hand-run deploy needs a Cloudflare API
# token on a developer machine, and the broker exists precisely so that no such
# credential is stored anywhere: a workflow proves its identity with a
# GitHub-signed OIDC JWT and receives a short-lived, least-privilege token in
# exchange. Telling an operator to run wrangler by hand would trade that
# property away for a shorter sentence in a README.
#
# So the session does not deploy. It dispatches this, which runs with its own
# pinned identity behind a reviewer gate and leaves the audit trail in Actions.
#
# The org's site-deploy.yml took a STORED `secrets.CLOUDFLARE_API_TOKEN`, which
# predates the broker. It is being migrated in bounded-systems/.github#64 — the
# secret becomes optional and the broker is opt-in per caller, since it is a
# reusable workflow whose callers cannot all be enumerated. So this is not a
# lone exception to a house style; it is the direction both are moving.
#
# ⚠ SETUP REQUIRED — BOTH FAIL CLOSED, DELIBERATELY
#
#   1. The broker's Workers-edit tier must be LIVE. It is: bounded-systems/infra
#      #66 activated CF_PG_WORKERS_SCRIPTS_EDIT + the WORKERS_DEPLOY registry
#      (with a `lease` target pinned to THIS workflow ref), and #67 proved the
#      end-to-end mint (an account-owned parent CAN delegate Workers:Edit it
#      does not itself hold — the earlier 502/9109 was the parent lacking the
#      scope, now fixed). If a mint 9109s again, it is an infra-side scope
#      regression, not a problem here.
#
#   2. This job hits the broker at `/deploy/lease` with audience
#      `cloudflare-workers-deploy-broker` — the Workers-edit tier's route and
#      audience (NOT the general `/cloudflare/*` Cloudflare-token path). Both are
#      the defaults below; `FRONT_DESK_CF_BROKER_PATH` can override the route.
#      The broker mints ONLY for this exact workflow ref that entered the
#      `lease-deploy` Environment. The infra registry's `script` hint is
#      `front-desk-lease` (this Worker's wrangler name).
#
#   3. A HUMAN APPROVAL before anything is minted or deployed. Dispatch alone
#      must not be able to replace the mechanism that enforces mutual exclusion
#      for the whole scheduler. This was originally an environment
#      REQUIRED-REVIEWERS assertion, but that rule is UNAVAILABLE on this plan —
#      proven empirically 2026-07-30 (infra run 30550473295):
#        422 Failed to create the environment protection rule. Please ensure
#            the billing plan supports the required reviewers protection rule.
#      (org-owned private repo on GitHub Free; infra#69 has the full record.)
#      So the gate lives IN the workflow instead. It was an issue-comment
#      approval (`await-approval`, in-house since infra#62) until infra#538
#      carried infra#480's FACE ID CEREMONY here: the run opens a ceremony
#      pinning THIS run on THIS commit, notifies the approver, and redeems the
#      authorization — fail closed — BEFORE the Cloudflare mint. infra#235
#      established why the comment could not be the gate: it cannot tell the
#      dispatcher from the approver, so "dispatch alone must not be able to" was
#      exactly what it failed to prevent. No break-glass, per infra#18.
#
# WHY THIS ALSO SETS THE REPO VARIABLE
# ------------------------------------
# The endpoint is an OUTPUT of deploying, so a human copying it into
# `gh variable set` by hand is a step that can be skipped, mistyped, or done
# against the wrong repo — and the failure mode is `production-a2` staying red
# while everyone believes it was deployed. The workflow already knows the URL;
# it publishes it with a broker-minted App token, closing the loop in the same
# run that produced it.
on:
  workflow_dispatch:
    inputs:
      race_after_deploy:
        description: "After deploying, race the new endpoint and require exactly one winner"
        required: false
        default: true
        type: boolean
concurrency:
  group: lease-deploy # never two deploys of the serialization point at once
  cancel-in-progress: false
permissions:
  id-token: write # OIDC → broker
  contents: read
  issues: write # the ceremony opens a notification issue carrying the approve URL
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Kept for its deployment history and (plan-supported) branch policy — NOT a reviewer
    # gate; required-reviewer rules 422 on this plan. The approval step below is the gate.
    environment: lease-deploy
    timeout-minutes: 60 # bound a forgotten approval — the wait doesn't hang a runner forever
    env:
      BROKER_URL: ${{ vars.CF_BROKER_URL }}
      CF_BROKER_PATH: ${{ vars.FRONT_DESK_CF_BROKER_PATH || '/deploy/lease' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Human authorization BEFORE the mint — no credential exists until a Face ID has
      # signed THIS run's request (infra#480; the same shape as desk's deploy.yml and
      # keeper-deploy in bounded-systems/infra). The keeper URL is a literal on purpose:
      # a variable here would let configuration move the ceremony somewhere else.
      #
      # THIS REPLACED A COMMENT GATE (infra#538). infra#235 established that
      # `await-approval` cannot tell the dispatcher from the approver — whoever dispatches
      # a run can approve their own — so what it gated was a formality. infra#480 retired
      # it; this lane kept it only because the migration was rolled out to a LIST of lanes
      # rather than to everything matching the predicate, and nothing measured the
      # remainder. infra#538's `gate-strength` check now does, for infra; this repo is
      # outside that check's reach, which is why the migration had to be carried here by
      # hand.
      #
      # There is NO break-glass, following infra#18: a single-boolean bypass to a
      # mechanism known not to work is not a fallback. The test is whether the lane is
      # upstream of the keeper's own fix path — keeper-deploy keeps one because a broken
      # keeper cannot serve the ceremony that repairs it. This lane authorizes nothing the
      # keeper depends on, so while keeper.bounded.tools is down it simply does not run.
      - name: Open the Face ID ceremony
        id: ceremony
        env:
          KEEPER_URL: https://keeper.bounded.tools
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          req="$(jq -nc --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" \
            '{v:"bounded.deploy-request.v1",repo:"front-desk-scheduler",workflow:"lease-deploy.yml",run_id:$run,head_sha:$sha}')"
          start="$(curl -sfS --max-time 20 -X POST -H 'content-type: application/json' \
            -d "{\"requestType\":\"bounded.deploy-request.v1\",\"request\":$req}" \
            "$KEEPER_URL/authorize/start")" || {
            echo "::error::the keeper refused to open a ceremony. There is no break-glass (infra#18): this lane does not run until keeper.bounded.tools is back."
            exit 1
          }
          ceremony="$(jq -r '.ceremonyId // empty' <<<"$start")"
          approve_url="$(jq -r '.approveUrl // empty' <<<"$start")"
          [ -n "$ceremony" ] && [ -n "$approve_url" ] || { echo "::error::keeper returned no ceremony"; exit 1; }
          echo "ceremony=$ceremony" >> "$GITHUB_OUTPUT"
          echo "request=$req" >> "$GITHUB_OUTPUT"
          echo "approve_url=$approve_url" >> "$GITHUB_OUTPUT"
          # The issue is a NOTIFICATION, not a credential: commenting on it does nothing.
          # The approval is the Face ID at the URL.
          issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Face ID: approve lease-deploy (run ${GITHUB_RUN_ID})" \
            --body "$(printf 'A lease-deploy run wants to mint a short-lived Workers:Edit token (broker /deploy/lease), deploy the front-desk-lease Worker, and publish FDS_CLAIM_ENDPOINT. This replaces the mechanism that enforces mutual exclusion for the whole scheduler — approve only if that is intended.\n\nApprove with your passkey (15-minute window):\n\n%s\n\nThis issue is a notification only — comments here authorize nothing (infra#480 retired the comment gate). Run: https://github.com/%s/actions/runs/%s' "$approve_url" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")")"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"
          echo "ceremony open — approve at $approve_url"

      # BEFORE the wait below. The issue above is a GitHub notification — batched,
      # routed wherever GitHub decides, and no use against a window that can be as
      # short as two minutes. infra#552 gave the seven infra ceremony lanes a push
      # and this lane was not in that scope (infra#553).
      #
      # No guard, because the ceremony above has none: if it ran, an approval is
      # genuinely waiting.
      #
      # Non-fatal on every path. The gate is the Face ID; a notice that failed to
      # send must not fail a deploy that is otherwise authorized.
      - name: Notify subscribed devices that an approval is waiting
        env:
          APPROVE_URL: ${{ steps.ceremony.outputs.approve_url }}
          NOTICE_TITLE: Approve front-desk lease-deploy
          NOTICE_BODY: >-
            Mints a Workers:Edit token, deploys the front-desk-lease Worker and publishes
            FDS_CLAIM_ENDPOINT — replacing the mechanism that enforces mutual exclusion
            for the whole scheduler.
        run: |
          set -euo pipefail
          summary() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ -z "${APPROVE_URL:-}" ]; then
            summary "Approval notice: skipped — no approve URL from the ceremony."
            exit 0
          fi
          tok="$(curl -sS --max-time 20 \
                   -H "authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" \
                   "${ACTIONS_ID_TOKEN_REQUEST_URL:-}&audience=https://desk.bounded.tools" \
                 | jq -r '.value // empty' || true)"
          if [ -z "$tok" ]; then
            echo "::warning::could not mint an OIDC token for desk; no approval notice sent"
            summary "Approval notice: **skipped** — no OIDC token."
            exit 0
          fi
          payload="$(jq -nc --arg t "$NOTICE_TITLE" --arg b "$NOTICE_BODY" \
                       --arg u "$APPROVE_URL" --arg r "$GITHUB_RUN_ID" \
            '{title:$t, body:($b + " Run " + $r + "."), url:$u}')"
          code="$(curl -sS --max-time 30 -o /tmp/appr.json -w '%{http_code}' -X POST \
                    -H "authorization: Bearer $tok" -H 'content-type: application/json' \
                    -d "$payload" https://desk.bounded.tools/approval || true)"
          case "$code" in
            200) summary "$(jq -r '"Approval notice: sent \(.sent)/\(.total) — pruned \(.pruned), failed \(.failed)"' /tmp/appr.json)" ;;
            403) summary "Approval notice: desk has not allowlisted this lane yet (HTTP 403 — add this workflow's ref to NOTIFY_WORKFLOW_REFS in desk's src/oidc.js and deploy desk)." ;;
            404|405|503) summary "Approval notice: not available on the deployed Worker yet (HTTP $code)." ;;
            *)   echo "::warning::desk /approval answered ${code:-no response}"
                 summary "Approval notice: **failed** — desk answered ${code:-no response}." ;;
          esac
          exit 0

      - name: Wait for the Face ID, then redeem — fail closed
        env:
          KEEPER_URL: https://keeper.bounded.tools
          CEREMONY: ${{ steps.ceremony.outputs.ceremony }}
          REQ: ${{ steps.ceremony.outputs.request }}
        run: |
          set -euo pipefail
          # Poll until the human approves, the ceremony expires (15 min), or the keeper
          # says GONE. pending/gone being distinct answers is what makes this loop's
          # failure mean "never approved", not "lost a race".
          deadline="$(( $(date +%s) + 900 ))"
          auth=""
          while :; do
            code="$(curl -s --max-time 20 -o /tmp/result.json -w '%{http_code}' "$KEEPER_URL/result?id=${CEREMONY}")" || code=000
            if [ "$code" = "200" ]; then
              if jq -e '.pending' /tmp/result.json >/dev/null 2>&1; then :; else
                auth="$(jq -r '.authorizationId // empty' /tmp/result.json)"
                [ -n "$auth" ] && break
              fi
            elif [ "$code" = "410" ]; then
              echo "::error::the ceremony ended without an authorization: $(jq -r '.error // "gone"' /tmp/result.json 2>/dev/null). Nobody Face ID'd this run."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no Face ID within the 15-minute window — this run was not authorized."
              exit 1
            fi
            sleep 10
          done
          redeem="$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' \
            -d "{\"authorizationId\":\"$auth\",\"requestType\":\"bounded.deploy-request.v1\",\"request\":$REQ}" \
            "$KEEPER_URL/redeem")"
          person="$(jq -r '.redeemed.person // empty' <<<"$redeem")"
          if [ -z "$person" ]; then
            echo "::error::redemption refused: $(jq -r '.error // "unknown"' <<<"$redeem"). The grant did not match this run's request — failing closed."
            exit 1
          fi
          cred="$(jq -r '.redeemed.credentialId' <<<"$redeem")"
          be="$(jq -r '.redeemed.backupEligible' <<<"$redeem")"
          {
            echo "## Authorized by Face ID"
            echo "- person: \`$person\`"
            echo "- credential: \`$cred\`"
            echo "- backupEligible: \`$be\` (synced passkey ⇒ aal2 — recorded, not assumed away)"
            echo "- request bound to run ${GITHUB_RUN_ID} @ ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✓ authorized by $person (credential $cred)"

      - name: Close the ceremony notification
        if: ${{ steps.ceremony.outputs.issue_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.ceremony.outputs.issue_url }}
        run: gh issue close "$ISSUE_URL" --comment "Authorized by Face ID; ceremony complete." || true

      - name: Cloudflare credential (via OIDC broker)
        id: cfcred
        run: |
          set -euo pipefail
          [ -n "${BROKER_URL:-}" ] || { echo "::error::CF_BROKER_URL not set"; exit 1; }
          jwt="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cloudflare-workers-deploy-broker" | jq -r '.value // empty')"
          [ -n "$jwt" ] || { echo "::error::failed to obtain an OIDC token"; exit 1; }
          # NOT `curl -f`. `-f` DISCARDS THE RESPONSE BODY on an HTTP error, and
          # the broker's error body is the most useful thing in the whole
          # failure: it reports cf_errors, token_check and policy_check, which
          # is what separates "my request was wrong" from "the broker's own
          # credential cannot grant this". Throwing that away to save a line
          # would leave only "502".
          code="$(curl -sS -o /tmp/broker.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${jwt}" "${BROKER_URL%/}${CF_BROKER_PATH}" || echo 000)"
          body="$(cat /tmp/broker.json 2>/dev/null || true)"
          if [ "$code" != "200" ]; then
            echo "::error::broker returned HTTP ${code} for ${CF_BROKER_PATH}"
            echo "::error::  response: ${body:0:900}"
            # The discriminators, in the order they narrow the problem.
            case "$code" in
              401|403) echo "::error::  → this workflow's job_workflow_ref is not on the broker allowlist." ;;
              404)     echo "::error::  → wrong route. Set FRONT_DESK_CF_BROKER_PATH to what the broker serves." ;;
              502)
                echo "::error::  → the broker reached Cloudflare and Cloudflare refused the MINT."
                if grep -q '"ok":true' <<<"$body" && grep -q '9109' <<<"$body"; then
                  echo "::error::  → token_check ok + cf_error 9109 ('Unauthorized to access requested"
                  echo "::error::    resource') means the broker's OWN CF_BROKER_TOKEN cannot DELEGATE"
                  echo "::error::    the scope being asked for. A token can only mint permissions it"
                  echo "::error::    itself holds, so this is not fixed here: give the parent token"
                  echo "::error::    Workers Scripts: Edit at ACCOUNT scope in bounded-systems/infra,"
                  echo "::error::    and check the policy's resource names that account."
                else
                  echo "::error::  → inspect token_check / policy_check above; live detail with"
                  echo "::error::    \`wrangler tail cf-token-broker\` while re-running this."
                fi ;;
            esac
            exit 1
          fi
          tok="$(jq -r '.token // empty' <<<"$body")"
          [ -n "$tok" ] || { echo "::error::broker returned no Cloudflare token"; exit 1; }
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      - name: Deploy worker/lease
        id: deploy
        working-directory: worker/lease
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cfcred.outputs.token }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          # The URL is what the rest of this workflow publishes, so parse it and
          # FAIL if it is absent rather than proceeding with an empty variable.
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)"
          if [ -z "$url" ]; then
            echo "::error::deploy succeeded but no workers.dev URL was found in the output."
            echo "::error::Refusing to publish an empty FDS_CLAIM_ENDPOINT — that would leave"
            echo "::error::production-a2 red while looking deployed. Set the variable by hand."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::deployed $url"

      - name: Verify the deployment answers before publishing it
        # Publishing a URL that does not serve the lease API would point every
        # claimant at nothing. Cheap to check, and the alternative is discovering
        # it from a claim-race failure whose cause looks like the DO being wrong.
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if body="$(curl -fsS "${URL}/health" 2>/dev/null)" && [ "$(jq -r '.ok' <<<"$body")" = "true" ]; then
              echo "::notice::health ok"; exit 0
            fi
            sleep 3
          done
          echo "::error::${URL}/health did not answer ok — not publishing this endpoint"
          exit 1

      - name: Front Desk App token (via OIDC broker)
        id: apptoken
        # /github/front-desk-publish, NOT /github/front-desk. The publish needs Variables:write,
        # which GitHub's app-permissions downscoping schema cannot name (no `variables` key —
        # verified 2026-07-30; requesting it 422s the whole mint, which is what killed the first
        # lease-deploy run). front-desk-publish is the broker's FULL-GRANT entry: no downscoping
        # body, so the token carries the installation's whole grant incl. Variables — and the
        # broker only mints it for THIS workflow ref (pinned), behind the approval step above.
        run: |
          set -euo pipefail
          jwt="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github-app-broker" | jq -r '.value // empty')"
          [ -n "$jwt" ] || { echo "::error::failed to obtain an OIDC token for the App broker"; exit 1; }
          # Not `curl -f` — same reason as the Cloudflare step above: the broker's error body is
          # the diagnosis, and -f discards it (the first failure here surfaced as a bare 502).
          code="$(curl -sS -o /tmp/apptoken.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${jwt}" "${BROKER_URL%/}/github/front-desk-publish" || echo 000)"
          body="$(cat /tmp/apptoken.json 2>/dev/null || true)"
          if [ "$code" != "200" ]; then
            echo "::error::broker returned HTTP ${code} for /github/front-desk-publish"
            echo "::error::  response: ${body:0:600}"
            echo "::error::  401 = this workflow ref is not the pinned lease-deploy.yml@main"
            echo "::error::  404 = live broker predates the front-desk-publish entry — redeploy it"
            echo "::error::  502 = GitHub refused the mint (key/installation problem — wrangler tail)"
            exit 1
          fi
          tok="$(jq -r '.token // empty' <<<"$body")"
          [ -n "$tok" ] || { echo "::error::broker returned no App token"; exit 1; }
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      - name: Publish FDS_CLAIM_ENDPOINT
        # Needs the App to hold `Variables: write` AND the broker's GH_APPS map to
        # ASK for it. Those are two different things — see mirror-migrate.yml's
        # header: a mint that succeeds followed by a 403 means the broker did not
        # request the scope (fix in infra), while a mint that fails outright means
        # the installation lacks it (fix on the App, then accept the update).
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          if ! gh variable set FDS_CLAIM_ENDPOINT --repo "${{ github.repository }}" --body "$URL"; then
            echo "::error::could not set FDS_CLAIM_ENDPOINT. THE WORKER IS DEPLOYED at $URL —"
            echo "::error::only publication failed. Set it by hand and production-a2 will pick it up:"
            echo "::error::  gh variable set FDS_CLAIM_ENDPOINT -R ${{ github.repository }} -b '$URL'"
            exit 1
          fi
          echo "::notice::FDS_CLAIM_ENDPOINT = $URL"

      - name: Prove it excludes
        # The deploy is not the deliverable; the evidence is. This races the
        # endpoint that was just published and requires exactly one winner —
        # the acceptance criterion from docs/queue-vs-log.md, run here so a
        # deploy cannot be reported as success without it.
        if: ${{ inputs.race_after_deploy }}
        env:
          FDS_CLAIM_ENDPOINT: ${{ steps.deploy.outputs.url }}
          RACE_ITEM: ${{ vars.FDS_CLAIM_RACE_ITEM || 'race#1' }}
          # The worker authenticates writes (worker/lease/src/auth.mjs). For an
          # installation token like github.token the check is repo COVERAGE, not
          # push — so contents:read suffices. Same line production-a2 uses; its
          # absence here 401'd every claim in the first raced deploy.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$HOME/.deno" sh -s -- -y
          "$HOME/.deno/bin/deno" install --frozen
          node scripts/claim-race.ts
          RACE_AGENTS=32 node scripts/claim-race.ts

      - name: Summary
        if: always()
        run: |
          {
            echo "### lease-deploy"
            echo "- endpoint: \`${{ steps.deploy.outputs.url || 'not deployed' }}\`"
            echo "- raced: ${{ inputs.race_after_deploy && 'yes' || 'no' }}"
            echo ""
            echo "A2 is discharged only by \`production-a2\` going green against this"
            echo "endpoint — deploying is not the same as proving."
          } >> "$GITHUB_STEP_SUMMARY"
