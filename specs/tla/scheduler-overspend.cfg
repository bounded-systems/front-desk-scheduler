\* Racy mechanism, checking ONLY NoOverspend, so TLC surfaces the budget-TOCTOU
\* counterexample specifically (the racy model also violates MutualExclusion, which
\* would otherwise be reported first). Two agents claim distinct items, both gate at
\* consumed=0 (0+4<=6), then both apply → consumed=8 > cap 6.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Items  = {i1, i2}
  Cap    = 6
  Effort = 4
  Atomic = FALSE
INVARIANT TypeOK
INVARIANT NoOverspend
