\* Safe mechanism — expect TLC to PASS all invariants and the liveness property.
\* Cap=8 = Cardinality(Items)*Effort, so every item can be afforded → <>AllDone holds.
\* CAS claim + atomic reserve → no double-claim, no overspend, across all interleavings.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Items  = {i1, i2}
  Cap    = 8
  Effort = 4
  Atomic = TRUE
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT NoOverspend
PROPERTY Liveness
