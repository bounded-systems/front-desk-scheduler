\* Racy mechanism — expect TLC to report a counterexample.
\* Cap=6, Effort=4: two concurrent spends (both gate at consumed=0) overspend to 8>6,
\* and two agents can both claim the same item (double-claim). TLC finds whichever
\* invariant breaks first and prints the interleaving.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Items  = {i1, i2}
  Cap    = 6
  Effort = 4
  Atomic = FALSE
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT NoOverspend
